name: BRITECH MD — Generate WhatsApp Session
on:
  workflow_dispatch:
    inputs:
      phone_number:
        description: "WhatsApp number with country code, digits only (example: 2547XXXXXXXX)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate archive password secret
        env:
          SESSION_ARCHIVE_PASSWORD: ${{ secrets.SESSION_ARCHIVE_PASSWORD }}
        run: |
          if [ -z "$SESSION_ARCHIVE_PASSWORD" ]; then
            echo "::error::Add SESSION_ARCHIVE_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
      - run: npm install --ignore-scripts
      - name: Start with a clean session workspace
        run: rm -rf session session-auth.zip session-auth.zip.enc SESSION_ID.txt SESSION_ID.txt.enc
      - name: Generate pairing code and wait for WhatsApp link
        env:
          PHONE_NUMBER: ${{ inputs.phone_number }}
          SESSION_DIR: ./session/auth
          SESSION_ID_FILE: ./SESSION_ID.txt
          CI: "true"
        run: npm run session:ci
      - name: Verify session credentials and create SESSION_ID
        env:
          SESSION_ARCHIVE_PASSWORD: ${{ secrets.SESSION_ARCHIVE_PASSWORD }}
        run: |
          set -euo pipefail
          test -s session/auth/creds.json || { echo "::error::creds.json missing"; exit 1; }
          node -e "const c=require('./session/auth/creds.json'); if(!c.registered || !c.me?.id) process.exit(1)"
          zip -qr session-auth.zip session
          base64 -w 0 session-auth.zip > SESSION_ID.txt
          test -s SESSION_ID.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in SESSION_ID.txt -out SESSION_ID.txt.enc -pass env:SESSION_ARCHIVE_PASSWORD
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in session-auth.zip -out session-auth.zip.enc -pass env:SESSION_ARCHIVE_PASSWORD
          {
            echo "## BRITECH MD session generated"
            echo ""
            echo "- WhatsApp registration was verified from the saved credentials."
            echo "- Encrypted SESSION_ID and auth-folder backup are uploaded as short-lived artifacts."
            echo "- The SESSION_ID is sent as a text-file attachment to the linked WhatsApp self-chat."
            echo "- No session ID or pairing code is printed in Actions logs."
            echo "- Treat the SESSION_ID file as a password."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload encrypted SESSION_ID
        uses: actions/upload-artifact@v4
        with:
          name: britech-session-id-encrypted
          path: SESSION_ID.txt.enc
          retention-days: 1
          if-no-files-found: error
      - name: Upload encrypted auth-folder backup
        uses: actions/upload-artifact@v4
        with:
          name: britech-session-encrypted
          path: session-auth.zip.enc
          retention-days: 1
          if-no-files-found: error
      - name: Send SESSION_ID file to linked WhatsApp self-chat
        continue-on-error: true
        env:
          PHONE_NUMBER: ${{ inputs.phone_number }}
          SESSION_DIR: ./session/auth
          SESSION_ID_FILE: ./SESSION_ID.txt
        run: npm run session:send
