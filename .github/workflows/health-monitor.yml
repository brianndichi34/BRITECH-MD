name: BRITECH MD — CI health monitor

on:
  workflow_run:
    workflows: ["BRITECH MD — CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report-failure:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Create or update one repair issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automated CI repair needed';
            const run = context.payload.workflow_run;
            const runUrl = run?.html_url || `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions`;
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'automated-repair' });
            } catch {
              await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name: 'automated-repair', color: 'D93F0B', description: 'Detected automatically by CI health monitoring' });
            }
            const body = [
              'BRITECH MD CI reported a failure on the default branch.',
              '',
              `Run: ${runUrl}`,
              `Commit: ${run?.head_sha || 'manual health check'}`,
              '',
              'Safe response: inspect the run logs, reproduce with `npm test`, and merge only a reviewed fix.',
              'This monitor does not automatically modify WhatsApp session files or push unreviewed source code.'
            ].join('\n');
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated-repair',
              per_page: 100
            });
            const issue = existing.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
              core.info(`Updated existing repair issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['automated-repair']
              });
              core.info(`Created repair issue #${created.data.number}`);
            }
